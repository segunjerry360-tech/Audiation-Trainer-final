name: Build Audiation Trainer APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  CI: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Prepare launcher icon
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png
          npx capacitor-assets generate --android

      - name: Add microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<application'
          permissions = '''<uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              '''
          if "android.permission.RECORD_AUDIO" not in s:
              s = s.replace(marker, permissions + marker, 1)
          p.write_text(s)
          PY

      - name: Sync Android project
        run: npx cap sync android

      - name: Configure Maven mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maven-mirror.gradle <<'EOF'
          allprojects {
              repositories {
                  maven {
                      url 'https://maven-central.storage-download.googleapis.com/maven2/'
                  }
                  mavenCentral()
              }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audiation-Trainer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
